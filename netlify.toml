  NEXT_PUBLIC_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpwbXFocHVoanFib21ycHV1b3llIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDc3MjA0NDgsImV4cCI6MjA2MzI5NjQ0OH0.NThXXKetrK2iPAENglmzJB8tuIXxEZoMqK1--jXWeWA"
